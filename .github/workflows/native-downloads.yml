name: Pixie 1.3 — Spotify 9.1.92

on:
  push:
    paths: ['NativeDownloads/**', 'Sources/**', 'Makefile', '.github/workflows/native-downloads.yml']
  pull_request:
    paths: ['NativeDownloads/**', 'Sources/**', 'Makefile', '.github/workflows/native-downloads.yml']
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Optional HTTPS URL to the compatible Spotify 9.1.92 / EeveeSpotify 7.0.0 IPA'
        required: false
        default: ''
        type: string
     

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 NativeDownloads/tools/validate_eevee_9192.py
      - run: python3 NativeDownloads/tools/test.py --build-dir outputs/ci-host-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixie-host-test-results
          path: outputs/ci-host-tests
          retention-days: 7

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.ipa_url != ''
    needs: validate
    runs-on: macos-15
    
    steps:
      - name: Checkout EeveeSpotify + Pixie
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: brew install make dpkg ldid

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Build EeveeSwiftProtobuf
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          gmake build-eeveeswiftprotobuf

      - name: Download source IPA
        env:
          SOURCE_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          case "$SOURCE_IPA_URL" in
            https://*) ;;
            *) echo "An HTTPS IPA URL is required"; exit 1 ;;
          esac
          curl --proto '=https' --proto-redir '=https' \
            --location --fail --retry 3 \
            "$SOURCE_IPA_URL" \
            --output "$RUNNER_TEMP/source.ipa"
          unzip -tq "$RUNNER_TEMP/source.ipa"

      - name: Compile EeveeSpotify + Pixie
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          set -euo pipefail
          gmake -j4 all FINALPACKAGE=1

          test -s .theos/obj/EeveeSpotify.dylib

          cp .theos/obj/EeveeSpotify.dylib \
            "$RUNNER_TEMP/EeveeSpotify.dylib"

          codesign --force --sign - --timestamp=none \
            "$RUNNER_TEMP/EeveeSpotify.dylib"

          codesign --verify --strict \
            "$RUNNER_TEMP/EeveeSpotify.dylib"

      - name: Package Pixie 1.3 IPA
        run: |
          set -euo pipefail
          mkdir -p outputs/ci-package

          python3 NativeDownloads/tools/build_eevee_9192.py \
            "$RUNNER_TEMP/source.ipa" \
            --eevee-dylib "$RUNNER_TEMP/EeveeSpotify.dylib" \
            --output outputs/ci-package/Spotify-9.1.92-EeveeSpotify-Pixie-v1.3.ipa \
            > outputs/ci-package/build-report.json

      - name: Validate finished IPA
        run: |
          set -euo pipefail
          IPA="outputs/ci-package/Spotify-9.1.92-EeveeSpotify-Pixie-v1.3.ipa"
          test -s "$IPA"
          unzip -tq "$IPA"
          echo "Pixie 1.3 IPA validated."

      - name: Upload finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-9.1.92-EeveeSpotify-Pixie-v1.3
          path: outputs/ci-package
          if-no-files-found: error
          retention-days: 7

